# Dual-provider startup overlay: Whoosh'd local model + approved DeepSeek V4 Flash.
# Secrets remain in the selected env file; this overlay contains no credentials.

services:
  backend:
    environment: &whooshd_deepseek_env
      CODEXIFY_SUPPORTED_PROFILE: "v1-whooshd-deepseek-web"
      LLM_PROVIDER: "local"
      ALLOW_CLOUD_PROVIDERS: "true"
      CODEXIFY_LOCAL_ONLY_MODE: "false"
      CODEXIFY_EGRESS_ALLOWLIST: "deepseek"
      LOCAL_PROVIDER_VENDOR: "whooshd"
      LOCAL_PROVIDER_DISPLAY_NAME: "Whoosh'd"
      LOCAL_BASE_URL: "http://host.docker.internal:8000/v1"
      WHOOSHD_HEALTH_BASE_URL: "http://host.docker.internal:8000"
      LOCAL_API_KEY: "local"
      LOCAL_CHAT_MODEL: "${LOCAL_CHAT_MODEL}"
      LOCAL_LLM_MODEL: "${LOCAL_CHAT_MODEL}"
      DEFAULT_LOCAL_MODEL: "${LOCAL_CHAT_MODEL}"
      LLM_MODEL: "${LOCAL_CHAT_MODEL}"
      DEEPSEEK_CHAT_MODEL: "deepseek-v4-flash"
      LLM_REQUEST_TIMEOUT_SECONDS: "600"
      # ADR-074: Compose transports the one operator-selected chat model.
      # Vision and GGUF are independent model domains.
      LOCAL_VISION_MODEL: "${LOCAL_VISION_MODEL}"
      LOCAL_GGUF_MODEL: "${LOCAL_GGUF_MODEL}"

  worker-chat:
    environment: *whooshd_deepseek_env

  worker-warmup:
    environment: *whooshd_deepseek_env

  worker-chat-embed:
    environment: *whooshd_deepseek_env
