<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codexify Browser Host</title>
    <link rel="stylesheet" href="./shell.css">
  </head>
  <body>
    <header class="shell-header">
      <div><p class="eyebrow">Development/internal unsigned proof</p><h1>Codexify Browser Host</h1></div>
      <button id="reload" type="button">Reload remote</button>
    </header>
    <section class="shell-state" aria-live="polite">
      <span id="status">Starting trusted shell…</span>
      <span id="origin">No remote origin</span>
      <span id="versions">Contract negotiation pending</span>
    </section>
    <section class="capture-panel" aria-label="Browser context capture">
      <div class="capture-actions">
        <button id="capture-selected" type="button">Preview selected text</button>
        <button id="capture-visible" type="button">Preview visible page</button>
        <button id="attach-capture" type="button" disabled>Attach preview ephemerally</button>
        <button id="cancel-capture" type="button" disabled>Cancel preview</button>
      </div>
      <p id="capture-status">No capture preview</p>
      <pre id="capture-preview" aria-label="Untrusted capture preview">No page content has crossed the capture boundary.</pre>
    </section>
    <main id="remote-region" aria-label="Untrusted remote fixture"></main>
    <script src="./shell.js"></script>
  </body>
</html>
