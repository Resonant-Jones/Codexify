# Bounded Scout qualification logging override. The existing conf.d routing,
# proxies and access enforcement remain untouched. Remove this mount to roll back.
user nginx;
worker_processes auto;
# nginx error records can include the original URI/referrer. Safe HTTP status
# logs and Guardian's bounded stage classifications remain available instead.
error_log /dev/null;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '[$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
