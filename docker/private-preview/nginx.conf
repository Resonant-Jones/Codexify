resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream guardian_backend {
    zone guardian_backend 64k;
    server backend:8888 resolve;
}

# Legacy contract marker; runtime proxying uses the dynamic upstream above.
# proxy_pass http://backend:8888;

server {
    listen 8080;
    server_name _;

    # This is the only browser-facing local origin.  Cloudflared terminates
    # its tunnel against this listener; backend and Vite stay on the Compose
    # network and are never published to the host.
    client_max_body_size 25m;

    location = /health {
        proxy_pass http://guardian_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health/ {
        proxy_pass http://guardian_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The private preview intentionally serves Vite's development module graph
    # behind this single origin.  Source modules beneath /api/ must remain Vite
    # traffic; proxy_pass without a URI preserves the full path and query.
    location ~ ^/api/.*\.(?:ts|tsx|js|jsx)$ {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:5173;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The canonical create-job URI is slashless.  Keep an exact Guardian route
    # so Nginx does not redirect it into the slash-terminated child namespace.
    location = /api/imports/openai-account {
        proxy_pass http://guardian_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account-import batches have their own Guardian-side limits and may be
    # larger than the generic private-preview request limit.
    location /api/imports/openai-account/ {
        client_max_body_size 0;
        proxy_pass http://guardian_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Semantic API traffic remains Guardian-owned.  Do not add ^~ here: the
    # bounded Vite source-module classifier above must remain eligible.
    location /api/ {
        proxy_pass http://guardian_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://guardian_backend/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        # Vite's host allowlist remains internal.  The public Host is never
        # passed through to the development server.
        proxy_set_header Host localhost:5173;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
