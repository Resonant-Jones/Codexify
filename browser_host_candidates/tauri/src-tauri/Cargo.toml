[package]
name = "codexify-tauri-browser-host-proof"
version = "0.1.0"
description = "Proof-only incumbent Tauri Browser Host candidate"
authors = ["Codexify"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "codexify_tauri_browser_host_proof"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
hex = "=0.4.3"
rand = "=0.8.5"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.8.5", features = [] }
time = { version = "=0.3.44", features = ["formatting"] }
