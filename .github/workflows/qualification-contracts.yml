name: Qualification Contracts

on:
  push:
    branches: [main]
    paths:
      - 'docs/qualification/**'
      - 'scripts/qualification/**'
      - 'tests/qualification/**'
      - '.github/workflows/qualification-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/qualification/**'
      - 'scripts/qualification/**'
      - 'tests/qualification/**'
      - '.github/workflows/qualification-contracts.yml'
  workflow_dispatch:

concurrency:
  group: qualification-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-contracts:
    name: Qualification Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required: the freshness projection compares the
          # tested commit against the tip to decide whether a qualification
          # run still describes current code.
          fetch-depth: 0
          lfs: true

      - name: Verify tracked paths are valid
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/verification/deny_invalid_git_paths.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci.txt
            pyproject.toml

      - name: Install test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r backend/requirements-ci.txt
          python -m pip install -e .

      - name: Run qualification contract tests
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest -q --disable-warnings tests/qualification

      - name: Check qualification registry has not drifted
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/qualification/generate_registry.py --check

      - name: Validate qualification registry
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/qualification/validate_registry.py
