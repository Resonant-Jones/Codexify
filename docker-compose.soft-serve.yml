services:
  soft-serve:
    image: charmcli/soft-serve:v0.11.6
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        case "$${SOFT_SERVE_INITIAL_ADMIN_KEYS:-}" in
          ""|REPLACE_WITH_*)
            echo "SOFT_SERVE_INITIAL_ADMIN_KEYS is required for Soft Serve startup." >&2
            exit 1
            ;;
        esac
        /usr/local/bin/soft serve &
        soft_serve_pid=$$!
        attempts=0
        until /usr/local/bin/soft settings allow-keyless false >/dev/null 2>&1 \
          && /usr/local/bin/soft settings anon-access no-access >/dev/null 2>&1
        do
          if ! kill -0 "$$soft_serve_pid" 2>/dev/null; then
            wait "$$soft_serve_pid"
            exit $$?
          fi
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            echo "Soft Serve did not initialize its access settings within 60 seconds." >&2
            kill "$$soft_serve_pid" 2>/dev/null || true
            wait "$$soft_serve_pid" || true
            exit 1
          fi
          sleep 1
        done
        wait "$$soft_serve_pid"
    environment:
      SOFT_SERVE_DATA_PATH: /soft-serve
      SOFT_SERVE_INITIAL_ADMIN_KEYS: "${SOFT_SERVE_INITIAL_ADMIN_KEYS:-}"
      SOFT_SERVE_NAME: "${SOFT_SERVE_NAME:-Codexify VaultNode Soft Serve}"
      SOFT_SERVE_SSH_LISTEN_ADDR: ":23231"
      SOFT_SERVE_SSH_PUBLIC_URL: "${SOFT_SERVE_SSH_PUBLIC_URL:-ssh://localhost:23231}"
      SOFT_SERVE_HTTP_LISTEN_ADDR: ":23232"
      SOFT_SERVE_HTTP_PUBLIC_URL: "${SOFT_SERVE_HTTP_PUBLIC_URL:-http://localhost:23232}"
      SOFT_SERVE_STATS_LISTEN_ADDR: ":23233"
    volumes:
      - "${CODEXIFY_SOFT_SERVE_DATA_DIR:-${HOME}/.local/share/codexify/soft-serve}:/soft-serve"
    ports:
      - "${CODEXIFY_SOFT_SERVE_BIND_HOST:-127.0.0.1}:${CODEXIFY_SOFT_SERVE_SSH_PORT:-23231}:23231"
      - "${CODEXIFY_SOFT_SERVE_BIND_HOST:-127.0.0.1}:${CODEXIFY_SOFT_SERVE_HTTP_PORT:-23232}:23232"
      - "${CODEXIFY_SOFT_SERVE_BIND_HOST:-127.0.0.1}:${CODEXIFY_SOFT_SERVE_STATS_PORT:-23233}:23233"
